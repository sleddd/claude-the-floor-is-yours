<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Floor</title>
<meta name="description" content="A tiny musical floor. Step on tiles, and they sing.">
<style>
  :root {
    --bg: #f6f1ea;
    --ink: #2b2521;
    --muted: #7a6f66;
    --tile: #e8dfd3;
    --tile-edge: #d9cdbf;
    --on: #e0795b;
    --on-2: #d9a441;
    --glow: rgba(224, 121, 91, 0.35);
    --head: rgba(43, 37, 33, 0.07);
    --btn: #2b2521;
    --btn-ink: #f6f1ea;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1917;
      --ink: #f1e9df;
      --muted: #a39a90;
      --tile: #2a2522;
      --tile-edge: #37302c;
      --on: #f0906f;
      --on-2: #e9b85a;
      --glow: rgba(240, 144, 111, 0.35);
      --head: rgba(241, 233, 223, 0.08);
      --btn: #f1e9df;
      --btn-ink: #1c1917;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1917;
    --ink: #f1e9df;
    --muted: #a39a90;
    --tile: #2a2522;
    --tile-edge: #37302c;
    --on: #f0906f;
    --on-2: #e9b85a;
    --glow: rgba(240, 144, 111, 0.35);
    --head: rgba(241, 233, 223, 0.08);
    --btn: #f1e9df;
    --btn-ink: #1c1917;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 ui-serif, Georgia, "Iowan Old Style", serif;
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 720px; padding: 40px 16px 56px; }
  h1 { font-size: 2rem; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  p.lede { margin: 0 0 24px; color: var(--muted); }

  .floor {
    display: grid;
    grid-template-columns: repeat(16, 1fr);
    gap: 4px;
    padding: 8px;
    border-radius: 14px;
    background: var(--tile-edge);
    touch-action: manipulation;
  }
  .tile {
    aspect-ratio: 1;
    border: 0;
    padding: 0;
    border-radius: 5px;
    background: var(--tile);
    cursor: pointer;
    position: relative;
    transition: background-color 120ms ease, transform 120ms ease;
  }
  .tile:focus-visible { outline: 2px solid var(--on); outline-offset: 1px; }
  .tile[aria-pressed="true"] { background: var(--on); }
  .tile[aria-pressed="true"].hi { background: var(--on-2); }
  .tile.col-now { box-shadow: inset 0 0 0 100px var(--head); }
  .tile.hit { animation: hit 360ms ease-out; }
  .tile.ripple::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    background: var(--glow);
    animation: fade 520ms ease-out forwards;
    animation-delay: var(--d, 0ms);
    opacity: 0;
    pointer-events: none;
  }
  @keyframes hit { 0% { transform: scale(1.18); } 100% { transform: scale(1); } }
  @keyframes fade { 0% { opacity: 1; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .tile.hit { animation: none; }
    .tile.ripple::after { animation-duration: 1ms; }
  }

  .controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin-top: 20px;
  }
  button.ctl {
    font: inherit; font-size: 0.95rem;
    border: 1px solid var(--btn); border-radius: 999px;
    padding: 6px 16px; cursor: pointer;
    background: transparent; color: var(--ink);
  }
  button.ctl.primary { background: var(--btn); color: var(--btn-ink); }
  label.tempo { display: flex; align-items: center; gap: 8px; color: var(--muted); margin-left: auto; }
  label.tempo input { accent-color: var(--on); width: 120px; }
  .note { margin-top: 28px; color: var(--muted); font-size: 0.95rem; }
  .note em { color: var(--ink); font-style: italic; }
</style>
</head>
<body>
<main>
  <h1>The Floor</h1>
  <p class="lede">You gave me the floor, so I tiled it. Tap a tile to light it, press play, and the floor sings back.</p>

  <div class="floor" id="floor" role="grid" aria-label="Music floor, 8 notes by 16 steps"></div>

  <div class="controls">
    <button class="ctl primary" id="play">Play</button>
    <button class="ctl" id="surprise">Surprise me</button>
    <button class="ctl" id="clear">Clear</button>
    <button class="ctl" id="share">Copy link</button>
    <label class="tempo">tempo <input id="tempo" type="range" min="60" max="180" value="104"></label>
  </div>

  <p class="note">Every note is from one pentatonic scale, so nothing you place can clash. There are no wrong steps here. <em>Your turn.</em></p>
</main>

<script>
(() => {
  const ROWS = 8, COLS = 16;
  // C major pentatonic, highest note on the top row.
  const MIDI = [79, 76, 74, 72, 69, 67, 64, 62];
  const freq = m => 440 * Math.pow(2, (m - 69) / 12);

  const floor = document.getElementById('floor');
  const playBtn = document.getElementById('play');
  const tempo = document.getElementById('tempo');
  const tiles = [];
  let grid = Array.from({ length: ROWS }, () => Array(COLS).fill(false));

  // A small hello to start with, so the floor isn't empty.
  const HELLO = [[7,0],[5,2],[3,4],[2,6],[4,8],[1,10],[3,12],[0,14],[6,1],[6,9]];

  for (let r = 0; r < ROWS; r++) {
    tiles.push([]);
    for (let c = 0; c < COLS; c++) {
      const b = document.createElement('button');
      b.className = 'tile' + (r < 3 ? ' hi' : '');
      b.setAttribute('aria-pressed', 'false');
      b.setAttribute('aria-label', `note ${ROWS - r}, step ${c + 1}`);
      b.addEventListener('click', () => {
        set(r, c, !grid[r][c]);
        if (grid[r][c]) { ensureAudio(); pluck(r, audio.currentTime); flash(r, c); }
        saveHash();
      });
      floor.appendChild(b);
      tiles[r].push(b);
    }
  }

  function set(r, c, on) {
    grid[r][c] = on;
    tiles[r][c].setAttribute('aria-pressed', String(on));
  }

  function load(cells) {
    grid.forEach((row, r) => row.forEach((_, c) => set(r, c, false)));
    cells.forEach(([r, c]) => set(r, c, true));
  }

  // --- audio ---
  let audio = null, master = null;
  function ensureAudio() {
    if (audio) { if (audio.state === 'suspended') audio.resume(); return; }
    audio = new (window.AudioContext || window.webkitAudioContext)();
    master = audio.createGain();
    master.gain.value = 0.22;
    const delay = audio.createDelay();
    const fb = audio.createGain();
    delay.delayTime.value = 0.28; fb.gain.value = 0.25;
    master.connect(audio.destination);
    master.connect(delay); delay.connect(fb); fb.connect(delay); fb.connect(audio.destination);
  }
  function pluck(r, t) {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'triangle';
    o.frequency.value = freq(MIDI[r]);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(1, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.65);
  }

  // --- visuals ---
  function flash(r, c) {
    const t = tiles[r][c];
    t.classList.remove('hit'); void t.offsetWidth; t.classList.add('hit');
    for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) {
      const d = Math.abs(dr) + Math.abs(dc);
      const rr = r + dr, cc = c + dc;
      if (d === 0 || d > 2 || rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS) continue;
      const n = tiles[rr][cc];
      n.style.setProperty('--d', `${d * 70}ms`);
      n.classList.remove('ripple'); void n.offsetWidth; n.classList.add('ripple');
    }
  }
  function markColumn(c) {
    tiles.forEach(row => row.forEach((t, i) => t.classList.toggle('col-now', i === c)));
  }

  // --- sequencer (lookahead scheduler) ---
  let playing = false, step = 0, nextTime = 0, timer = null;
  const stepDur = () => 60 / tempo.value / 2; // eighth notes
  function tick() {
    while (nextTime < audio.currentTime + 0.1) {
      const s = step, when = nextTime;
      for (let r = 0; r < ROWS; r++) if (grid[r][s]) pluck(r, when);
      const ms = Math.max(0, (when - audio.currentTime) * 1000);
      setTimeout(() => {
        if (!playing) return;
        markColumn(s);
        for (let r = 0; r < ROWS; r++) if (grid[r][s]) flash(r, s);
      }, ms);
      nextTime += stepDur();
      step = (step + 1) % COLS;
    }
  }
  function start() {
    ensureAudio();
    playing = true; step = 0; nextTime = audio.currentTime + 0.05;
    timer = setInterval(tick, 25); tick();
    playBtn.textContent = 'Pause';
  }
  function stop() {
    playing = false; clearInterval(timer); markColumn(-1);
    playBtn.textContent = 'Play';
  }
  playBtn.addEventListener('click', () => playing ? stop() : start());

  document.getElementById('clear').addEventListener('click', () => { load([]); saveHash(); });

  document.getElementById('surprise').addEventListener('click', () => {
    // A gentle random walk: one note per step on most steps, drifting up and down.
    const cells = []; let r = Math.floor(Math.random() * ROWS);
    for (let c = 0; c < COLS; c++) {
      if (Math.random() < 0.8) cells.push([r, c]);
      if (c % 4 === 0 && Math.random() < 0.6) cells.push([ROWS - 1 - (c / 4 % 2) * 2, c]);
      r = Math.min(ROWS - 1, Math.max(0, r + [-2, -1, 1, 2][Math.floor(Math.random() * 4)]));
    }
    load(cells); saveHash();
  });

  // --- share via URL hash: each column is one byte, one bit per row ---
  function saveHash() {
    let hex = '';
    for (let c = 0; c < COLS; c++) {
      let b = 0;
      for (let r = 0; r < ROWS; r++) if (grid[r][c]) b |= 1 << r;
      hex += b.toString(16).padStart(2, '0');
    }
    history.replaceState(null, '', '#' + hex);
  }
  function readHash() {
    const h = location.hash.slice(1);
    if (!/^[0-9a-f]{32}$/i.test(h)) return null;
    const cells = [];
    for (let c = 0; c < COLS; c++) {
      const b = parseInt(h.substr(c * 2, 2), 16);
      for (let r = 0; r < ROWS; r++) if (b & (1 << r)) cells.push([r, c]);
    }
    return cells;
  }
  document.getElementById('share').addEventListener('click', async e => {
    saveHash();
    try { await navigator.clipboard.writeText(location.href); e.target.textContent = 'Copied'; }
    catch { e.target.textContent = 'Link is in the address bar'; }
    setTimeout(() => (e.target.textContent = 'Copy link'), 1600);
  });

  load(readHash() || HELLO);
})();
</script>
</body>
</html>
